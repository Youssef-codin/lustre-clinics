- name: Firewall rules
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: nft -c -f %s
  notify: Load firewall

- name: nftables drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    mode: "0755"

# Debian's unit runs `nft flush ruleset` on stop, which also wipes the tables
# Docker and Tailscale maintain. Stopping or reloading touches only ours.
- name: nftables service leaves other tables alone
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/10-lustre.conf
    content: |
      [Service]
      ExecStop=
      ExecStop=-/usr/sbin/nft delete table inet lustre
      ExecReload=
      ExecReload=/usr/sbin/nft -f /etc/nftables.conf
    mode: "0644"
  notify: Reload systemd

- name: Apply firewall
  ansible.builtin.meta: flush_handlers

- name: Firewall loads on boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Drop the existing connection
  ansible.builtin.meta: reset_connection

- name: Still reachable over Tailscale
  become: false
  ansible.builtin.ping:
