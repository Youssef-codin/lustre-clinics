all:
  children:
    clinics:
      hosts:
        smilemakers:
          # The Tailscale address, never the LAN one: this play restricts SSH
          # and the firewall on the LAN side while it is connected.
          ansible_host: 100.125.78.21
          # Where the LAN SSH fallback is allowed from. Set per clinic.
          lan_cidr: 192.168.1.0/24
      vars:
        ansible_user: youssef
        timezone: Africa/Cairo
        # Read from the machine running the play so no key is committed.
        admin_pubkeys:
          - "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') ~ '/.ssh/id_ed25519.pub') }}"
